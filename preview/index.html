<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Touchbard Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1119; --panel: #151926; --panelx: #0d1018;
      --line: #262c42; --line-s: #1d2336;
      --text: #eef2fa; --muted: #8b94b4; --dim: #626c8c;
      --accent: #3c89f6; --accent-2: #7759f6; --accent-3: #2fd6f6;
      --grad: linear-gradient(135deg, #3c89f6, #7759f6);
      --ok: #28c840; --warn: #febc2e; --err: #ff5f57;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(1100px 520px at 50% -12%, rgba(119, 89, 246, 0.16), transparent 62%),
        radial-gradient(760px 380px at 88% 112%, rgba(47, 214, 246, 0.08), transparent 60%),
        var(--bg);
      font-family: var(--sans);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ---- header ---- */
    header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line-s);
      background: rgba(14, 17, 25, 0.72);
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      align-items: center;
      /* gap: 10px; */
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 13px;
      color: var(--text);
    }
    .brand .logo {
      /* width: 10px; height: 10px; border-radius: 3px; */
      background: var(--grad);
      box-shadow: 0 0 14px rgba(119, 89, 246, 0.8);
    }
    .brand span {
      font-style: normal;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand .tag {
      text-transform: none;
      letter-spacing: 0.08em;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 8px;
      background: var(--panelx);
    }

    .spacer { flex: 1; }

    #hud {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      background: var(--panel);
      transition: color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    #hud::before {
      content: "";
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--dim);
      box-shadow: none;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #hud[data-state="ok"] { color: var(--text); border-color: rgba(40, 200, 64, 0.4); }
    #hud[data-state="ok"]::before { background: var(--ok); box-shadow: 0 0 10px rgba(40, 200, 64, 0.8); }
    #hud[data-state="wait"] { color: var(--text); border-color: rgba(254, 188, 46, 0.4); }
    #hud[data-state="wait"]::before { background: var(--warn); box-shadow: 0 0 10px rgba(254, 188, 46, 0.6); animation: pulse 1.4s ease-in-out infinite; }
    #hud[data-state="err"] { color: var(--err); border-color: rgba(255, 95, 87, 0.45); }
    #hud[data-state="err"]::before { background: var(--err); box-shadow: 0 0 10px rgba(255, 95, 87, 0.7); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* ---- stage ---- */
    main {
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 28px 20px;
    }
    #stageWrap {
      padding: 10px;
      border-radius: 10px;
      /* background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 38%), var(--panelx); */
      border: 1px solid var(--line);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
        0 24px 70px -24px rgba(0, 0, 0, 0.85),
        0 0 130px -40px rgba(119, 89, 246, 0.45);
    }
    #stage {
      display: block;
      box-sizing: content-box;
      aspect-ratio: 2008/60;
      background: #000;
      /* border-radius: 9px; */
      outline: none;
      cursor: crosshair;
      width: 100%;
    }
    #stage:focus-visible {
      box-shadow: 0 0 0 2px rgba(60, 137, 246, 0.55);
    }

    /* ---- footer ---- */
    footer {
      flex: none;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      border-top: 1px solid var(--line-s);
      background: rgba(14, 17, 25, 0.72);
      backdrop-filter: blur(12px);
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--dim);
    }
    footer .hint { margin-left: auto; color: var(--dim); letter-spacing: 0.02em; }
    footer .hint b { color: var(--muted); font-weight: 600; }
    #diaghud {
      color: var(--accent-3);
      white-space: pre;
    }
    #diaghud[hidden] { display: none; }

    @media (max-width: 560px) {
      footer .hint { display: none; }
      .brand .tag { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="logo"></span>touch<span>bard</span> <span class="tag">preview</span></div>
    <div class="spacer"></div>
    <div id="hud">connecting…</div>
  </header>
  <main id="stageHost">
    <div id="stageWrap">
      <canvas width="2008" height="60" id="stage" tabindex="0"></canvas>
    </div>
  </main>
  <footer>
    <span>v1 · ws</span>
    <div id="diaghud" hidden></div>
    <!-- <span class="hint">click / drag / scroll <b>right-click</b> to interact</span> -->
  </footer>
  <script>
    const hudPill = document.getElementById("hud");
    new MutationObserver(() => {
      const t = hudPill.textContent || "";
      hudPill.dataset.state =
        /^(connected|resized|v\d)/.test(t.trim()) ? "ok"
        : /disconnected|mismatch|already connected|error/i.test(t) ? "err"
        : "wait";
    }).observe(hudPill, { childList: true, characterData: true, subtree: true });
  </script>
  <script src="/preview.js"></script>
</body>
</html>
